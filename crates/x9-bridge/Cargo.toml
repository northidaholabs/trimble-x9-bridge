[package]
name = "x9-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bridge service: the one API every client uses to reach a Trimble X9 (see api/bridge-v1.openapi.yaml)."

[dependencies]
x9-client = { path = "../x9-client" }
axum = "0.7"
tokio = { workspace = true, features = ["sync", "signal", "net"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
anyhow = { workspace = true }
trimble-tzf = { git = "https://github.com/northidaholabs/trimble-tzf", rev = "2bd38dd" }
zune-jpeg = "0.5"
miniz_oxide = "0.9"
crc32fast = "1"
toml = "0.8"
ab_glyph = "0.2"
rustfft = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
copc-rs = "0.5"
libc = "0.2"  # statvfs: free space on the data disk, for the scan cache budget
las = "=0.9.5"  # copc-rs 0.5 needs the laz 0.9 that las 0.9.5 and earlier use

[dev-dependencies]
x9-mock = { path = "../x9-mock" }
tower = { version = "0.5", features = ["util"] }
