openapi: 3.1.0
info:
  title: X9 bridge API
  version: 1.0.0-draft.3
  summary: The one API every client uses to reach a Trimble X9 scanner.
  description: |
    The bridge service runs next to the scanner (a Pi on the tripod or a desk
    machine) and is the only thing that talks to it. Every client goes through
    this API: AI agents via the MCP server, the web UI, the `x9` CLI,
    scripts, and agent frameworks calling these operations as functions.
    Clients enforce nothing; the rules (busy, moved, battery, queue,
    approvals) live here.

    Conventions:
    - JSON, `snake_case`. Lengths in metres, angles in radians, times in
      RFC 3339 UTC, durations in seconds.
    - `ha` is the instrument's horizontal angle as the scanner uses it
      (clockwise seen from above, `[0, 2π)`); `va` is the vertical angle from
      the zenith (`0` = straight up).
    - Long work (scans, exports, measurements) returns `202` with a `Job`;
      follow it with `GET /jobs/{job_id}` or the event stream.
    - IDs are opaque strings assigned by the bridge. Scans are keyed by the
      scanner's own scan UUID, because the scanner's numeric scan ids are
      positional and can change.
    - Errors use `application/problem+json` (RFC 9457) with a machine-readable
      `code` (see `docs/errors.md`).

    Implementation status: paths, parameters, fields and values marked
    `x-status: planned` are part of the design but not implemented by the
    bridge yet. Planned paths answer `404` with an empty body. Everything
    else is implemented. User guide: `docs/guide.md`.
servers:
  - url: http://localhost:8795/v1
    description: Bridge on this machine
  - url: http://{bridge}:8795/v1
    description: Bridge over ZeroTier or the LAN
    variables:
      bridge:
        default: bridge.local
security:
  - bearer: []
tags:
  - name: system
  - name: projects
  - name: scans
  - name: aiming
  - name: jobs
  - name: approvals
  - name: products
  - name: recipes
  - name: log

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check (no auth).
      security: []
      responses:
        "200":
          description: The bridge is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok, version]
                properties:
                  ok: { type: boolean }
                  version: { type: string }

  /whoami:
    get:
      tags: [system]
      operationId: whoAmI
      summary: The caller's token name and role.
      description: Lets a client show only what the caller may do.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                type: object
                required: [name, role]
                properties:
                  name: { type: string }
                  role: { type: string, enum: [viewer, agent, operator, admin] }
        default: { $ref: "#/components/responses/Problem" }

  /status:
    get:
      tags: [system]
      operationId: getStatus
      summary: Bridge and scanner state in one read.
      responses:
        "200":
          description: Current status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        default: { $ref: "#/components/responses/Problem" }

  /rules:
    get:
      tags: [system]
      operationId: getRules
      summary: The rules the bridge enforces, with their current settings.
      responses:
        "200":
          description: Rule settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rules" }
        default: { $ref: "#/components/responses/Problem" }

  /scan-modes:
    get:
      tags: [scans]
      operationId: listScanModes
      summary: Scan modes the scanner offers, with time and density figures.
      responses:
        "200":
          description: Modes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScanMode" }
        default: { $ref: "#/components/responses/Problem" }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      responses:
        "200":
          description: Projects on the scanner.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project on the scanner (agent, operator, admin).
      description: |
        The bridge generates the project UUID. `name` is trimmed and must be
        1–64 bytes with no `/`. A name the scanner already has is
        `409 conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64, pattern: "^[^/]+$" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Problem" }

  /scans:
    get:
      tags: [scans]
      operationId: listScans
      parameters:
        - { name: project_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Scans, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scan" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [scans]
      operationId: startScan
      summary: Queue a full-dome or area scan.
      description: |
        Admission runs every rule. A request no rule blocks is queued; a scan
        from an `agent` token is held as `awaiting_approval` unless an active
        grant covers it. `viewer` tokens are refused (`403 forbidden`, checked
        before the body, so even a malformed request gets it). Right before
        the scanner starts, the worker checks connection, battery and storage
        again, and that the scanner is idle (a task the bridge cancelled itself
        is waited out, up to 60 s, in phase `waiting`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    get:
      tags: [scans]
      operationId: getScan
      responses:
        "200":
          description: One scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scan" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [scans]
      operationId: deleteScan
      summary: Delete a scan from the scanner (operator only, confirmed).
      description: |
        Needs an `operator` or `admin` token (`403 forbidden`) and an
        `X-Confirm` header equal to `scan_id` (`412 confirm_mismatch`). The
        bridge also removes its cached copy of the scan file and preview and
        the exports made from the scan since it started; afterwards all of
        them are `404 not_found`.
      parameters: [{ $ref: "#/components/parameters/Confirm" }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/preview:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    get:
      tags: [scans]
      operationId: getScanPreview
      summary: The scanner's preview image (grid-aligned intensity panorama).
      responses:
        "200":
          description: JPEG.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/tzf:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    get:
      tags: [scans]
      operationId: getScanTzf
      summary: The raw scan file.
      description: |
        Downloaded once and cached. Like the preview, it is served only while
        the scanner lists the scan: each request asks the scanner first
        (`404 not_found` once it is gone, `503 scanner_disconnected` when the
        scanner cannot be reached).
      responses:
        "200":
          description: TZF bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/view:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    get:
      tags: [scans]
      operationId: getScanView
      summary: Thinned points for a viewer (X9V1 binary).
      description: |
        Every kth row and column of the scan grid, so that about `max_points`
        remain. Built from the scan file on first use and cached. Body,
        little-endian: `X9V1`; u32 n; u32 stride k; f32 angular step (rad);
        n × [x, y, z] f32 (metres, levelled); n u8 grey; n u8 spacing class
        (0 fine ≤ 6 mm, 1 good ≤ 12, 2 coarse ≤ 25, 3 sparse).
      parameters:
        - name: max_points
          in: query
          schema: { type: integer, minimum: 10000, maximum: 8000000, default: 2000000 }
      responses:
        "200":
          description: X9V1 points.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/coverage:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    get:
      tags: [scans]
      operationId: getScanCoverage
      summary: What the scan covered, for a person or an agent.
      description: |
        Point spacing at full resolution (range × angular step) and a plan
        from above in 10 cm cells within 25 m: seen cells, and shadows (no
        points at any height though nearer than the farthest return in that
        direction, and over 1 m from the scanner).
      responses:
        "200":
          description: Coverage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/coverage/image:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    get:
      tags: [scans]
      operationId: getScanCoverageImage
      summary: The coverage plan as a picture.
      description: |
        x right, y up, one pixel per 10 cm cell: greens to orange by spacing
        class, red shadow, dark nothing, a white cross at the scanner. Coverage
        only, never intensity.
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/next-station:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    put:
      tags: [scans]
      operationId: proposeNextStation
      summary: Show the person where to set up next, on this station's preview.
      description: |
        Checked against the preview (everything inside it), drawn, kept (the
        latest per scan), logged and announced as a `next_station` event. Any
        role but `viewer`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NextStationRequest" }
      responses:
        "200":
          description: The kept proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NextStation" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [scans]
      operationId: getNextStation
      responses:
        "200":
          description: The latest proposal for this scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NextStation" }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/next-station/plan:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    get:
      tags: [scans]
      operationId: planNextStation
      summary: Where to set up next, computed from a full dome's points.
      description: |
        Up to three spots on open ground reachable on foot, a step out, seeing
        the most ground this station couldn't while sharing enough surface to
        be registered (greedy: each later pick covers what the earlier left).
        Each has its preview pixel and a landmark beside it. No candidates
        comes with a `reason`. The plan without a subject is cached per scan.
        See the guide, "Plan the next station". Any role.
      parameters:
        - name: subject
          in: query
          required: false
          description: Preview columns `x0,x1` framing the job's subject (`x1 < x0` crosses the seam).
          schema: { type: string, pattern: "^[0-9]+,[0-9]+$" }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                type: object
                required: [cell_m, radius_m, candidates]
                properties:
                  scan_id: { type: string }
                  cell_m: { type: number }
                  radius_m: { type: number }
                  min_step_m: { type: number }
                  hidden_m2: { type: number }
                  still_hidden_m2: { type: number }
                  spots_tried: { type: integer }
                  preview_size: { type: array, items: { type: integer } }
                  subject_px: { type: array, items: { type: integer } }
                  subject_hidden_m2: { type: number }
                  reason: { type: string }
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: { type: integer }
                        xy_m: { type: array, items: { type: number } }
                        distance_m: { type: number }
                        walk_m: { type: number }
                        sees_hidden_m2: { type: number }
                        shared_surface_m: { type: number }
                        preview_px: { type: array, nullable: true, items: { type: integer } }
                        landmark:
                          type: object
                          nullable: true
                          properties:
                            xy_m: { type: array, items: { type: number } }
                            distance_m: { type: number }
                            height_m: { type: number }
                            footprint_m2: { type: number }
                            shape: { type: string, enum: [post, mass] }
                            preview_px: { type: array, nullable: true, items: { type: integer } }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/next-station/image:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    get:
      tags: [scans]
      operationId: getNextStationImage
      summary: The preview with the proposal drawn on it.
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{project_id}/mission:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [projects]
      operationId: getMission
      responses:
        "200": { description: "The project's mission and ledger.", content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [projects]
      operationId: setMission
      summary: Set what the job is for (replaces any earlier mission). See guide.md, Missions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal, kind, done_when]
              properties:
                goal: { type: string, maxLength: 300 }
                kind: { type: string, enum: [exterior, windows, room, custom] }
                done_when: { type: string, maxLength: 600 }
                targets: { type: array, items: { $ref: "#/components/schemas/MissionTarget" } }
      responses:
        "200": { description: The mission., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{project_id}/mission/targets:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [projects]
      operationId: updateMissionTargets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets: { type: array, items: { $ref: "#/components/schemas/MissionTarget" } }
      responses:
        "200": { description: The mission., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{project_id}/mission/targets/{target_id}/ask:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
      - { name: target_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [projects]
      operationId: askMissionTarget
      summary: Ask a question target of the point cloud now (up to 90 s on the Pi). See guide.md, Questions on site.
      responses:
        "200": { description: The verdict; numbers only with an answer., content: { application/json: { schema: { $ref: "#/components/schemas/AskResult" } } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{project_id}/mission/targets/{target_id}/ask/image:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
      - { name: target_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [projects]
      operationId: askMissionTargetImage
      responses:
        "200": { description: The latest evidence image., content: { image/png: {} } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{project_id}/mission/ready:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [projects]
      operationId: missionReady
      summary: Ready to leave; 409 while any target is open.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [summary], properties: { summary: { type: string, maxLength: 1000 } } }
      responses:
        "200": { description: The mission, now ready., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{project_id}/mission/sign-off:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [projects]
      operationId: missionSignOff
      summary: The person signs the job off (operator).
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { confirmed_via: { type: string, maxLength: 300 } } }
      responses:
        "200": { description: The mission, signed off., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{project_id}/registration:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [projects]
      operationId: getRegistration
      summary: The project's stations in one frame, and the walls found. See guide.md, Registration.
      responses:
        "200": { description: "The registration (empty stations before the first full dome).", content: { application/json: { schema: { $ref: "#/components/schemas/Registration" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [projects]
      operationId: register
      summary: Register again (the bridge does this after every full dome by itself). Any role but viewer.
      responses:
        "202": { description: "The registration job (the running one, if any; it then runs once more).", content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{project_id}/minimap:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
      - { name: format, in: query, required: false, schema: { type: string, enum: [png, svg], default: png } }
    get:
      tags: [projects]
      operationId: getMinimap
      summary: "The job so far as a line map: walls, numbered stations (amber when not trusted), wall targets; stations not placed listed under it."
      responses:
        "200":
          description: PNG, or SVG with format=svg.
          content:
            image/png:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{project_id}/registration/plan:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [projects]
      operationId: getRegistrationPlan
      summary: "The registered plan: stations, walls with ids, the mission's wall targets by status, a 5 m grid."
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{project_id}/registration/face:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [projects]
      operationId: judgeFace
      summary: How much of a wall face the registered stations saw (changes nothing). 409 before registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wall_id: { type: string }
                from: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
                to: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
      responses:
        "200": { description: The face's coverage., content: { application/json: { schema: { $ref: "#/components/schemas/FaceCoverage" } } } }
        default: { $ref: "#/components/responses/Problem" }

  /missions:
    get:
      tags: [projects]
      operationId: listMissions
      responses:
        "200": { description: Every project's mission, newest first., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Mission" } } } } }
        default: { $ref: "#/components/responses/Problem" }

  /next-stations:
    get:
      tags: [scans]
      operationId: listNextStations
      summary: Every scan's latest proposal, newest first.
      responses:
        "200":
          description: Proposals.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NextStation" }
        default: { $ref: "#/components/responses/Problem" }

  /aim:
    post:
      tags: [aiming]
      operationId: aimFromPreview
      summary: Turn a box drawn on a scan's preview into an area-scan window.
      description: |
        Refused with `409 instrument_moved` while the scanner reports it moved
        since its last scan (the scanner's own flag; the check is skipped when
        the scanner does not answer). Any role may call it; it only computes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AimRequest" }
      responses:
        "200":
          description: The window to scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AimResult" }
        default: { $ref: "#/components/responses/Problem" }

  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      parameters:
        - name: state
          in: query
          x-status: planned
          description: Planned; not implemented. The bridge ignores it and returns every job.
          schema: { $ref: "#/components/schemas/JobState" }
      responses:
        "200":
          description: Every job since the bridge started, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /jobs/{job_id}:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      tags: [jobs]
      operationId: getJob
      responses:
        "200":
          description: One job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /jobs/{job_id}/cancel:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a queued or running job (stops the scanner if scanning).
      description: >-
        A running scan job reads `cancelled` at once. The scanner keeps its
        task listed for a while after the stop (about 13 s on a real X9);
        the next queued scan waits for it to clear instead of failing with
        `scanner_busy`. If the scanner files what it had swept, the job gains
        `partial_scan_id` and the field log says so; keep or delete that scan.
        A `queued` or `awaiting_approval` job is cancelled at once; for a
        running scan the answer may still read `running` until the worker's
        next poll. A running export stops at its next check (during the
        download, between decoding and writing, or while writing) and reads
        `cancelled` with no export file. A granted scan cancelled before the
        scanner starts it gives its grant use back. `agent` tokens may cancel
        only jobs they requested.
      responses:
        "200":
          description: The job (cancelled, cancelling, or unchanged if already finished).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /jobs/{job_id}/approve:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      tags: [approvals]
      operationId: approveJob
      summary: Approve one job that is awaiting approval (operator only).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                run:
                  type: boolean
                  default: false
                  description: >-
                    For a recipe run's scan: also grant the run its later scans
                    (later startScan steps plus measureOpening rescans) for 2 hours,
                    counted as one approval.
      responses:
        "200":
          description: Approved and queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /grants:
    get:
      tags: [approvals]
      operationId: listGrants
      responses:
        "200":
          description: Grants that have not expired, including used-up ones.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Grant" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [approvals]
      operationId: createGrant
      summary: Let jobs inside a scope run without asking each time (operator only).
      description: |
        A grant lets `agent` scans within its limits queue without approval,
        for example "up to 12 scans in project P for the next 2 hours".
        Exports need no approval, so grants cover scans only. A grant never
        covers deletes. `scans_used` counts scans queued under it. A use is
        given back when the job is cancelled before the scanner starts it, but
        not when a job fails or is cancelled later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "201":
          description: Granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        default: { $ref: "#/components/responses/Problem" }

  /grants/{grant_id}:
    parameters:
      - { name: grant_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [approvals]
      operationId: revokeGrant
      responses:
        "204": { description: Revoked. }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/exports:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    post:
      tags: [products]
      operationId: exportPoints
      summary: Decode the scan to levelled points and write a file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "202":
          description: Queued; the job's result is an `Export`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /exports/{export_id}:
    parameters:
      - { name: export_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [products]
      operationId: getExport
      responses:
        "200":
          description: Export metadata and its checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        default: { $ref: "#/components/responses/Problem" }

  /exports/{export_id}/file:
    parameters:
      - { name: export_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [products]
      operationId: getExportFile
      responses:
        "200":
          description: The PLY or LAS file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/measurements:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    post:
      tags: [products]
      operationId: measure
      summary: Measure a feature in a scan (a `measure` job).
      description: |
        `kind: opening` measures a window's finished opening (the hole in the
        wall face) from a levelled close-up with wall on every side, or, with
        `box`, from the part of any scan (a full dome) inside that preview box. Any role
        but `viewer`. The job's phases are `downloading` and `measuring`; its
        result is `{measurement_id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeasurementRequest" }
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /measurements/{measurement_id}:
    parameters:
      - { name: measurement_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [products]
      operationId: getMeasurement
      responses:
        "200":
          description: Values, uncertainties, checks and the evidence image's URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Measurement" }
        default: { $ref: "#/components/responses/Problem" }

  /measurements/{measurement_id}/evidence:
    parameters:
      - { name: measurement_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [products]
      operationId: getMeasurementEvidence
      summary: The check image for a person or a vision model to verify.
      description: |
        The wall-face raster, upright: wall grey, the opening green, the
        measuring row and column red. Only the wall plane; no room image.
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /recipes:
    get:
      tags: [recipes]
      operationId: listRecipes
      responses:
        "200":
          description: Installed recipes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecipeSummary" }
        default: { $ref: "#/components/responses/Problem" }

  /recipes/{recipe_id}:
    parameters:
      - { name: recipe_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [recipes]
      operationId: getRecipe
      responses:
        "200":
          description: The recipe, as data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        default: { $ref: "#/components/responses/Problem" }

  /runs:
    get:
      tags: [recipes]
      operationId: listRuns
      responses:
        "200":
          description: Runs, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [recipes]
      operationId: startRun
      summary: Start running a recipe (agent, operator, admin).
      description: |
        The run executes under the starter's role and name, so approvals and
        grants apply as for direct requests. Every declared input is
        required; inputs with `choices` must be one of them. See
        `docs/recipes.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe_id, project_id]
              properties:
                recipe_id: { type: string }
                project_id: { type: string }
                inputs:
                  type: object
                  additionalProperties: true
                  description: Values for the recipe's declared inputs.
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /runs/{run_id}:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [recipes]
      operationId: getRun
      responses:
        "200":
          description: The run and the state of each step.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /runs/{run_id}/advance:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [recipes]
      operationId: advanceRun
      summary: Complete the current step that waits on someone (a choice, a confirmation, a box on the preview).
      description: |
        Only the run's starter (same token name), an `operator` or an `admin`;
        another `agent` gets `403 forbidden`, checked before the body is read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_id]
              properties:
                step_id: { type: string }
                input:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Updated run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /runs/{run_id}/propose:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [recipes]
      operationId: proposeRunStep
      summary: Propose a waiting person step's input for a person to confirm.
      description: |
        AI-first: the agent answers (a box on the preview, a measurement) and a
        person validates it with `advanceRun`. The step keeps waiting and gains
        `proposal`; a newer proposal replaces an older one. Same permission as
        `advanceRun`. When the step is later advanced, its output carries
        `proposal_accepted` (true when every `needs` field equals the proposal).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_id, input]
              properties:
                step_id: { type: string }
                input: { type: object, additionalProperties: true }
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Updated run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /runs/{run_id}/cancel:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [recipes]
      operationId: cancelRun
      summary: Stop a run; a scan or export in flight is cancelled too.
      description: |
        Only the run's starter (same token name), an `operator` or an `admin`;
        another `agent` gets `403 forbidden`.
      responses:
        "200":
          description: The run (it settles to `cancelled` shortly).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /log:
    get:
      tags: [log]
      operationId: getLog
      summary: The field log, oldest first.
      description: In memory; it starts empty when the bridge starts.
      parameters:
        - { name: since, in: query, description: Entries at or after this time., schema: { type: string, format: date-time } }
        - { name: project_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogEntry" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [log]
      operationId: addLogNote
      summary: Add a note (a person's or an agent's observation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000, description: Not only spaces. }
                project_id: { type: string }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        default: { $ref: "#/components/responses/Problem" }

  /events:
    get:
      tags: [system]
      operationId: streamEvents
      summary: Server-sent events for job progress, status changes and log entries.
      responses:
        "200":
          description: |
            `text/event-stream`. Event types: `job` (data: a `Job`), `run`
            (data: a `Run`), `log` (data: a `LogEntry`), `mission` (a
            `Mission`), `next_station` and `registration` (a `Registration`). Each event's data
            is the full JSON object on one line, so a client never needs to
            re-fetch. `job` events are also sent on every scanner poll while a
            scan runs. Events are not replayed; a client more than 256 events
            behind skips the missed ones. A `status` event is planned
            (`x-status: planned`); poll `GET /status` for now.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        One token per user or device, from the bridge's token file. Each token
        has a role: `viewer` (read only, plus `POST /aim`), `agent` (read,
        queue work; scans need approval or a grant; cancel only its own jobs;
        advance or cancel only runs it started), `operator` (everything an
        agent can, plus approvals, grants, cancelling any job, steering any
        run and confirmed deletes) or `admin`. In this version `admin` has
        exactly the rights of `operator`; changing rule settings and tokens
        over the API is planned.

  parameters:
    ScanId:
      name: scan_id
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string }
    Confirm:
      name: X-Confirm
      in: header
      required: true
      description: Must repeat the id of the resource being deleted.
      schema: { type: string }

  responses:
    Problem:
      description: An error, with a machine-readable code.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: |
            See `docs/errors.md`. `needs_approval` and `worker_unavailable` are
            planned and never returned in this version. `scanner_error` (502)
            is the scanner answering with an error status other than 409;
            `cache_error` (500) is the bridge failing to read or write its own
            files.
          enum:
            - unauthorized
            - forbidden
            - not_found
            - invalid_request
            - scanner_disconnected
            - scanner_busy
            - scanner_error
            - cache_error
            - instrument_moved
            - battery_low
            - storage_low
            - needs_approval
            - confirm_mismatch
            - decode_failed
            - check_failed
            - worker_unavailable
            - conflict
        hint:
          type: string
          description: What a client or person can do to clear it.

    Status:
      type: object
      required: [bridge, scanner]
      properties:
        bridge:
          type: object
          required: [version, started_at]
          properties:
            version: { type: string }
            started_at: { type: string, format: date-time }
            queue_length:
              type: integer
              description: Scan jobs `queued` or `awaiting_approval`.
            worker_ready:
              type: boolean
              description: Whether the measurement worker is available. Always `false` in this version.
        scanner:
          type: object
          required: [connected]
          description: When `connected` is false, the other fields are absent.
          properties:
            connected: { type: boolean }
            busy: { type: boolean, description: The scanner reports a current task (from any client). }
            current_job_id:
              type: [string, "null"]
              description: The bridge's scan job in state `running`. Exports run beside the scanner and never show here.
            battery_pct: { type: integer, minimum: 0, maximum: 100 }
            on_ac_power: { type: boolean }
            storage_free_bytes: { type: integer }
            moved_since_last_scan: { type: boolean }
            leveling:
              type: object
              properties:
                state:
                  type: string
                  enum: [none, in_progress, ok, error]
                  description: "`in_progress` stands for any value the scanner reports other than ok, none and error."
                compensator_on: { type: boolean }
                tilt_rad:
                  type: array
                  description: The two compensator readings, radians.
                  items: { type: number }
                  minItems: 2
                  maxItems: 2

    Rules:
      type: object
      properties:
        min_battery_pct_to_scan: { type: integer, default: 15 }
        min_storage_free_bytes: { type: integer, default: 2000000000 }
        require_approval_for_scans: { type: boolean, default: true }
        refuse_aim_after_move: { type: boolean, default: true }
        max_queue_length: { type: integer, default: 20 }

    ScanMode:
      type: object
      required: [mode, range_m, angular_step_rad, fixed_seconds, full_dome_seconds]
      properties:
        mode: { type: string, examples: [STD_L0, STD_L2, HS_L1] }
        range_m: { type: number }
        angular_step_rad: { type: number }
        points_full_dome: { type: integer }
        fixed_seconds:
          type: number
          description: Overhead every scan pays (leveling to file ready).
        full_dome_seconds:
          type: number
          description: The scanner's own estimate for a full-dome scan in this mode (color off).

    Project:
      type: object
      required: [project_id, name]
      properties:
        project_id: { type: string }
        name: { type: string }
        scan_count:
          type: integer
          description: Stations (full-dome scans) the scanner has numbered in the project; area scans are not counted.

    Window:
      type: object
      description: An area-scan window. `start_ha + delta_ha` may exceed 2π (the window crosses the seam). `start_va + delta_va` must not exceed π.
      required: [start_ha, delta_ha, start_va, delta_va]
      properties:
        start_ha: { type: number, minimum: 0, exclusiveMaximum: 6.283185307179586 }
        delta_ha: { type: number, exclusiveMinimum: 0, maximum: 6.283185307179586 }
        start_va: { type: number, minimum: 0, maximum: 3.141592653589793 }
        delta_va: { type: number, exclusiveMinimum: 0, maximum: 3.141592653589793 }

    ScanRequest:
      type: object
      required: [project_id, kind, mode]
      properties:
        project_id: { type: string }
        kind: { type: string, enum: [full_dome, area] }
        mode: { type: string, examples: [STD_L0, STD_L2] }
        color:
          type: boolean
          default: false
          description: Camera images after the sweep. Adds ~150 s; off by default.
        window:
          $ref: "#/components/schemas/Window"
          description: Required when `kind` is `area`; refused for `full_dome`.
        note: { type: string, description: Recorded in the field log. }

    Scan:
      type: object
      required: [scan_id, project_id, kind, mode]
      properties:
        scan_id: { type: string }
        project_id: { type: string }
        parent_scan_id:
          type: [string, "null"]
          description: For area scans, the station scan they belong to.
        station: { type: integer, description: Station number within the project. }
        kind: { type: string, enum: [full_dome, area] }
        mode: { type: string }
        color: { type: boolean }
        window:
          $ref: "#/components/schemas/Window"
          description: Area scans the bridge ran since it started.
        created_at:
          type: [string, "null"]
          format: date-time
          description: Known only for scans this bridge ran since it started (when the job started); the scanner doesn't record it.
        grid:
          type: object
          x-status: planned
          description: Planned; not returned yet.
          properties:
            rows: { type: integer }
            cols: { type: integer }
        point_count: { type: integer }
        tzf_bytes: { type: integer }
        has_intensity:
          type: boolean
          x-status: planned
          description: Planned; not returned yet. Whether the scan file itself carries intensity (otherwise the preview supplies it).
        timings:
          type: object
          description: >-
            Seconds from when the bridge sent the scan to the scanner, as
            observed. Only for scans this bridge ran since it started; empty
            for a partial scan from a cancelled job.
          properties:
            leveling_s: { type: number }
            sweep_s: { type: number }
            geometry_ready_s: { type: number }
            done_s: { type: number }

    AimRequest:
      type: object
      required: [reference_scan_id, box]
      properties:
        reference_scan_id:
          type: string
          description: A scan from the current station whose preview the box was drawn on.
        box:
          type: object
          description: Preview pixels, y down. `x1 < x0` wraps across the panorama seam.
          required: [x0, y0, x1, y1]
          properties:
            x0: { type: integer, minimum: 0 }
            y0: { type: integer, minimum: 0 }
            x1: { type: integer, minimum: 0 }
            y1: { type: integer, minimum: 0 }
        margin_rad: { type: number, default: 0.009, description: Padding on every side, radians. Negative values count as 0. }

    AimResult:
      type: object
      required: [window, preview_size, cells_per_pixel]
      properties:
        window: { $ref: "#/components/schemas/Window" }
        preview_size:
          type: array
          description: Width and height of the reference preview, pixels.
          items: { type: integer }
          minItems: 2
          maxItems: 2
        cells_per_pixel:
          type: array
          description: Scan grid cells per preview pixel, horizontal and vertical.
          items: { type: number }
          minItems: 2
          maxItems: 2
        estimated_seconds:
          type: object
          x-status: planned
          description: Planned; not returned yet. Predicted time per mode, from the mode's fixed and sweep figures.
          additionalProperties: { type: number }

    JobState:
      type: string
      enum: [awaiting_approval, queued, running, succeeded, failed, cancelled]

    Job:
      type: object
      required: [job_id, kind, state, created_at]
      properties:
        job_id: { type: string }
        kind:
          type: string
          enum: [scan, export, measurement, register]
          description: "`measurement` is planned (`x-status: planned`)."
        state: { $ref: "#/components/schemas/JobState" }
        phase:
          type: string
          description: >-
            Scans: `waiting` (for the scanner to clear a task the bridge
            cancelled), `leveling`, `sweeping`, `imaging` (color only).
            Exports: `downloading`, `decoding`. Absent once the job finishes.
          enum: [waiting, leveling, sweeping, imaging, downloading, decoding]
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: The scanner's task percentage (restarts during color imaging); 1 when a job succeeds.
        requested_by: { type: string, description: Token name. }
        run_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        result:
          description: Set when `state` is `succeeded`.
          oneOf:
            - { $ref: "#/components/schemas/ScanRef" }
            - { $ref: "#/components/schemas/ExportRef" }
            - { $ref: "#/components/schemas/MeasurementRef" }
        problem: { $ref: "#/components/schemas/Problem" }
        partial_scan_id:
          type: string
          description: >-
            Cancelled scan jobs only: the scan the scanner filed from the
            partial sweep. Set shortly after the cancel, once the scanner
            files it (a `job` event announces the change).
        request:
          $ref: "#/components/schemas/ScanRequest"
          description: Scan jobs only, the request as admitted, so a person can see what they approve.
        project_name:
          type: string
          description: Scan jobs only, the name of the project the scan goes into.

    ScanRef:
      type: object
      required: [scan_id]
      properties: { scan_id: { type: string } }
    ExportRef:
      type: object
      required: [export_id]
      properties: { export_id: { type: string } }
    MeasurementRef:
      type: object
      required: [measurement_id]
      properties: { measurement_id: { type: string } }

    GrantRequest:
      type: object
      required: [project_id, expires_at]
      properties:
        project_id: { type: string, description: Not checked against the scanner. }
        expires_at: { type: string, format: date-time, description: Must be in the future. }
        max_scans: { type: [integer, "null"], minimum: 0, description: Omitted or null for no limit. }
        allowed_modes:
          type: array
          description: Empty for any mode.
          items: { type: string }
        allow_color: { type: boolean, default: false }
        run_id:
          type: [string, "null"]
          description: Limit the grant to one recipe run. Not checked against existing runs.

    Grant:
      allOf:
        - $ref: "#/components/schemas/GrantRequest"
        - type: object
          required: [grant_id, granted_by, scans_used]
          properties:
            grant_id: { type: string }
            granted_by: { type: string }
            scans_used: { type: integer }

    Check:
      type: object
      description: One automatic check on a product. Clients should not use a product whose checks failed without saying so.
      required: [name, ok]
      properties:
        name:
          type: string
          description: Exports produce `point_count`, `levelled`, `coordinates` and `intensity` (always ok).
          examples: [point_count, levelled, coordinates, intensity]
        ok: { type: boolean }
        value: { type: number }
        threshold:
          type: number
          x-status: planned
          description: Planned; not returned yet.
        unit: { type: string }
        detail: { type: string }

    ExportRequest:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [ply, las, copc]
          description: >-
            `copc`: Cloud Optimized Point Cloud (LAS 1.4, point format 6,
            LAZ octree, local CRS), file `exp_….copc.laz`.
        intensity:
          type: string
          enum: [auto, scan, preview, none]
          default: auto
          description: >-
            The scan file's own intensity is not decoded yet: `auto` and `scan`
            use the scan's preview when it can be downloaded, else mid-grey.
            `preview` fails the export (`decode_failed`) without a preview.
            `none` writes mid-grey. Points are always levelled.

    MissionTarget:
      type: object
      required: [target_id]
      properties:
        target_id: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
        name: { type: string, maxLength: 80 }
        kind: { type: string, maxLength: 30 }
        status: { type: string, enum: [open, covered, measured, declined] }
        stations: { type: array, items: { type: string }, description: Scan ids in this project. }
        measurement_id: { type: string }
        note: { type: string, maxLength: 300 }
        wall_id: { type: string, writeOnly: true, description: "A wall of the registration; sets `face`." }
        face: { $ref: "#/components/schemas/Face" }
        geometry: { allOf: [{ $ref: "#/components/schemas/FaceCoverage" }], readOnly: true, description: "The bridge's judgement of `face`, kept current after every registration." }
        question:
          description: >-
            Write `"plumb"` to ask whether the face is plumb and how flat it is (needs a face), `""` to drop it.
            Read back as a Question. A target with a question is covered only by its answer.
          oneOf:
            - { type: string, enum: [plumb, ""], writeOnly: true }
            - { allOf: [{ $ref: "#/components/schemas/Question" }], readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    Question:
      type: object
      description: A question asked of a target's face, and its latest verdict (re-checked after every registration).
      properties:
        kind: { type: string, enum: [plumb] }
        verdict: { type: string, enum: [not_yet, does_not_fit, answer] }
        reason: { type: string, description: "Why not an answer: the share seen, too few points, \"settling\", or not one flat face." }
        asked: { type: boolean }
        seen_share: { type: number }
        stations: { type: array, items: { type: integer } }
        answer: { $ref: "#/components/schemas/PlumbAnswer" }
        checked_at: { type: string, format: date-time }

    PlumbAnswer:
      type: object
      description: Only with verdict `answer`.
      properties:
        out_of_plumb_mm: { type: number, description: "Over the face's height; positive when the top leans toward the stations' side." }
        lean_mm_per_m: { type: number }
        flat_rms_mm: { type: number }
        flat_p95_mm: { type: number }
        straightedge_ok_pct: { type: number }
        worst_strip_mm_per_m: { type: number }
        stations: { type: array, items: { type: integer } }

    AskResult:
      type: object
      required: [target_id, verdict, reason]
      properties:
        target_id: { type: string }
        kind: { type: string }
        verdict: { type: string, enum: [not_yet, does_not_fit, answer] }
        reason: { type: string }
        seen_pct: { type: number }
        stations: { type: array, items: { type: integer } }
        answer: { $ref: "#/components/schemas/PlumbAnswer" }
        seconds: { type: number }
        evidence_url: { type: string, description: "The face's heat map; its title carries numbers only for an answer." }
        unseen:
          type: array
          description: "With not_yet for coverage: the stretches not seen, each with the preview columns framing it from the latest station (the planner's subject)."
          items:
            type: object
            properties:
              from: { type: array, items: { type: number } }
              to: { type: array, items: { type: number } }
              length_m: { type: number }
              subject: { type: object, properties: { scan_id: { type: string }, station: { type: integer }, x0: { type: integer }, x1: { type: integer }, query: { type: string } } }

    Face:
      type: object
      description: A wall face in plan, in the project frame (metres).
      required: [from, to]
      properties:
        from: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        to: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }

    FaceCoverage:
      type: object
      properties:
        length_m: { type: number }
        seen_share: { type: number, description: "Share of the face's length seen (0.5 m columns with at least 1 m of wall height in points)." }
        covered: { type: boolean, description: "seen_share >= 0.8" }
        height_m: { type: array, items: { type: number } }
        spacing_mm: { type: object, properties: { p50: { type: number }, p90: { type: number } } }
        stations: { type: array, items: { type: object, properties: { station: { type: integer }, scan_id: { type: string }, seen_share: { type: number } } } }
        unseen: { type: array, items: { type: object, properties: { from: { type: array, items: { type: number } }, to: { type: array, items: { type: number } }, length_m: { type: number } } } }

    Registration:
      type: object
      properties:
        project_id: { type: string }
        frame: { type: string, description: "The first station's scanner: x and y as it faced (not north), z up, metres." }
        summary: { type: string }
        updated_at: { type: string, format: date-time }
        registering_job_id: { type: string, nullable: true }
        stations:
          type: array
          items:
            type: object
            properties:
              station: { type: integer }
              scan_id: { type: string }
              placed: { type: boolean }
              turn_deg: { type: number, nullable: true }
              xyz_m: { type: array, items: { type: number }, nullable: true }
              verdict: { type: string, enum: [confirmed, single, frame, doubtful, ambiguous, unplaced] }
              counts_for_coverage: { type: boolean }
              tied_to: { type: array, items: { type: integer } }
              checks:
                type: object
                properties:
                  surface_mm: { type: array, items: { type: number }, nullable: true, description: "Median and p90 distance to neighbours' same-facing surfaces." }
                  free_space: { type: number, nullable: true, description: Worst share of wall points where a neighbour saw through. }
                  ground_mm: { type: number, nullable: true }
              reasons: { type: array, items: { type: string } }
        pairs:
          type: array
          description: Pairs that fit (each a constraint), with what the global fit left them.
          items:
            type: object
            properties:
              stations: { type: array, items: { type: integer } }
              rms_mm: { type: number }
              matches: { type: integer }
              left_mm: { type: number }
              outlier: { type: boolean }
        pairs_tried: { type: integer }
        rejected_pairs:
          type: array
          description: Pairs that fit but were not used, weakly held or ambiguous, with why.
          items:
            type: object
            properties:
              stations: { type: array, items: { type: integer } }
              rms_mm: { type: number }
              matches: { type: integer }
              why: { type: string }
        walls:
          type: array
          items:
            type: object
            properties:
              wall_id: { type: string }
              from: { type: array, items: { type: number } }
              to: { type: array, items: { type: number } }
              length_m: { type: number }
              z_m: { type: array, items: { type: number } }
              seen_by: { type: array, items: { type: integer } }
        plan_url: { type: string }

    Mission:
      type: object
      properties:
        mission_id: { type: string }
        project_id: { type: string }
        goal: { type: string }
        kind: { type: string, enum: [exterior, windows, room, custom] }
        done_when: { type: string }
        state: { type: string, enum: [active, ready, signed_off] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        targets: { type: array, items: { $ref: "#/components/schemas/MissionTarget" } }
        ready_summary: { type: string }
        signed_off_by: { type: string }
        signed_off_at: { type: string, format: date-time }
        confirmed_via: { type: string }

    NextStationRequest:
      type: object
      required: [marker, note]
      properties:
        marker:
          type: object
          required: [x, y]
          properties:
            x: { type: integer, description: Preview pixel, on the ground where the tripod should stand. }
            y: { type: integer }
            label: { type: string, maxLength: 80 }
        note: { type: string, minLength: 1, maxLength: 600, description: "Directions in prose, by landmarks; never compass words." }
        labels:
          type: array
          items:
            type: object
            required: [x, y, text]
            properties:
              x: { type: integer }
              y: { type: integer }
              text: { type: string, maxLength: 80 }
              kind: { type: string, enum: [seen, hidden, landmark], default: landmark }
        boxes:
          type: array
          items:
            type: object
            required: [x0, y0, x1, y1]
            properties:
              x0: { type: integer }
              y0: { type: integer }
              x1: { type: integer }
              y1: { type: integer }
              text: { type: string, maxLength: 80 }
              kind: { type: string, enum: [seen, hidden, landmark], default: landmark }

    NextStation:
      allOf:
        - { $ref: "#/components/schemas/NextStationRequest" }
        - type: object
          properties:
            scan_id: { type: string }
            project_id: { type: string }
            station: { type: integer }
            proposed_by: { type: string }
            at: { type: string, format: date-time }
            preview_size: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
            image_url: { type: string }
            marker:
              type: object
              properties:
                distance_m:
                  type: number
                  description: How far out the scan saw the ground under the marker; absent when it saw none there. The picture then draws the tripod its real size there, with a shadow.

    Coverage:
      type: object
      required: [scan_id, point_count, angle_step_rad, spacing_mm, classes, plan, view, image_url]
      properties:
        scan_id: { type: string }
        point_count: { type: integer }
        angle_step_rad: { type: number }
        spacing_mm:
          type: object
          properties:
            p10: { type: number }
            p50: { type: number }
            p90: { type: number }
        classes:
          type: array
          items:
            type: object
            properties:
              name: { type: string, enum: [fine, good, coarse, sparse] }
              max_mm: { type: [number, "null"] }
              share: { type: number }
        plan:
          type: object
          properties:
            cell_m: { type: number }
            radius_m: { type: number }
            origin_m: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
            width: { type: integer }
            height: { type: integer }
            seen_m2: { type: number }
            shadows_assessed:
              type: boolean
              description: Only scans with returns in ≥ 90 % of directions (full domes).
            shadow_m2: { type: [number, "null"] }
            shadow_share: { type: [number, "null"] }
            beyond_radius_share: { type: number }
        view:
          type: object
          properties:
            points: { type: integer }
            stride: { type: integer }
        image_url: { type: string }

    Export:
      type: object
      required: [export_id, scan_id, format, point_count, checks]
      properties:
        export_id: { type: string }
        scan_id: { type: string }
        format: { type: string, enum: [ply, las, copc] }
        point_count: { type: integer }
        bytes: { type: integer }
        bounds_m:
          type: object
          properties:
            min: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
            max: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }

    MeasurementRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [opening]
          description: v1 measures one thing well; more kinds come later.
        box:
          type: object
          description: >-
            Measure only this box on the scan's preview (pixels, y down; `x1 < x0`
            wraps across the seam), padded by `margin_rad`: a window in a full
            dome, without a close-up. Same form as `AimRequest.box`. The result
            gains `crop` (`box`, `margin_rad`, grid `rows` and `cols`, `points`,
            `angle_step_mrad`). A box outside the preview, or with y0 >= y1, fails
            the job with `measure_failed`.
          properties:
            x0: { type: integer }
            y0: { type: integer }
            x1: { type: integer }
            y1: { type: integer }
        margin_rad:
          type: number
          default: 0.017
          description: Padding around `box` on every side, radians (the window recipe pads its close-ups the same).
        avoid:
          type: array
          x-status: planned
          description: Planned; ignored today. Preview boxes to ignore (a plant, a person).
          items:
            type: object
            properties:
              x0: { type: integer }
              y0: { type: integer }
              x1: { type: integer }
              y1: { type: integer }

    Measurement:
      type: object
      required: [measurement_id, scan_id, kind, values, checks, evidence_url]
      properties:
        measurement_id: { type: string }
        scan_id: { type: string }
        kind: { type: string, enum: [opening] }
        values:
          type: array
          items:
            type: object
            required: [name, value_m, uncertainty_m]
            properties:
              name: { type: string, examples: [opening_width, opening_height] }
              value_m: { type: number }
              uncertainty_m:
                type: number
                description: One grid cell (5 mm), or the spread of the unobstructed rows (columns) if larger.
              basis: { type: string, description: How it was measured, in one line. }
        checks:
          type: array
          description: "`wall_fit` (wall face RMS ≤ 3 mm), `opening_bounded` (wall on both sides in ≥ 60 % of rows and columns), `margins` (≥ 50 mm of wall beyond the opening on every side, seen in ≥ 80 % of lines), `unoccluded` (≤ 25 % of the 10 cm ring around the opening empty), `consistent` (≥ 30 % of rows and columns within 20 mm of the median)."
          items: { $ref: "#/components/schemas/Check" }
        opening_width_mm: { type: integer }
        opening_height_mm: { type: integer }
        uncertainty_mm: { type: integer }
        details:
          type: object
          description: Distance, wall fit, points used, rows and columns used and clean, spreads, grid cell, wall normal.
          additionalProperties: true
        evidence_url:
          type: string
          description: The evidence image, e.g. `/v1/measurements/{id}/evidence`.
        site_check:
          type: object
          description: Recipe action `measureOpening` only; rescans it made on its own. See recipes.md.
          properties:
            rescans: { type: integer }
            ok: { type: boolean }
            attempts: { type: array, items: { type: object, additionalProperties: true } }

    RecipeSummary:
      type: object
      required: [recipe_id, title, version]
      properties:
        recipe_id: { type: string, examples: [window-measurement] }
        title: { type: string }
        version: { type: string }
        summary: { type: string }

    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeSummary"
        - type: object
          required: [steps]
          properties:
            inputs:
              type: array
              items:
                type: object
                required: [name, type]
                properties:
                  name: { type: string }
                  type:
                    type: string
                    description: A hint for clients; the bridge does not check it.
                    examples: [string, number, boolean, choice]
                  choices: { type: array, items: { type: string } }
                  prompt: { type: string }
            steps:
              type: array
              items: { $ref: "#/components/schemas/RecipeStep" }

    RecipeStep:
      type: object
      description: |
        One step. `action` steps call an API operation; `person` steps wait
        for someone (move the tripod, confirm, draw a box) via `advance`.
      required: [step_id, title, kind]
      properties:
        step_id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [action, person, check] }
        operation_id:
          type: string
          enum: [startScan, aimFromPreview, exportPoints, addLogNote]
          description: For `action` steps, the API operation to call.
        arguments:
          type: object
          additionalProperties: true
          description: >-
            Fixed arguments. Strings may hold `{{project_id}}`,
            `{{input.<name>}}` and `{{steps.<id>.<field>…}}` placeholders; a
            string that is exactly one placeholder takes the referenced
            value's type. See `docs/recipes.md`.
        instructions: { type: string, description: What to tell the person, for `person` steps. }
        needs:
          type: array
          description: For `person` steps, the fields `advance` must supply.
          items: { type: string }
        preview_of: { type: string, description: For `person` steps, an earlier step whose scan preview to show. }
        propose_from: { type: string, description: For `person` steps, an earlier step whose output the bridge proposes as the answer. }
        review:
          type: string
          enum: [now, final]
          default: now
          description: >-
            For `person` steps. `final`: the agent answers the step itself and a
            person reviews it at the next `now` person step.
        of: { type: string, description: For `check` steps, the earlier step whose checks are inspected. }
        expect:
          type: array
          description: For `check` steps, the checks that must pass.
          items: { type: string }

    Run:
      type: object
      required: [run_id, recipe_id, project_id, state, steps]
      properties:
        run_id: { type: string }
        recipe_id: { type: string }
        project_id: { type: string }
        state:
          type: string
          enum: [running, waiting_for_person, succeeded, failed, cancelled]
          description: "`waiting_for_person` covers both an approval and a person step; see `waiting_for`."
        waiting_for:
          type: [string, "null"]
          enum: [approval, input, null]
          description: When waiting, whether for an operator's approval or a person step's input.
        recipe_version: { type: string }
        started_by: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        problem: { $ref: "#/components/schemas/Problem" }
        current_step_id: { type: [string, "null"] }
        authorized_by:
          type: array
          description: Grants the run's scans ran under (standing permission, not counted in `interventions`).
          items:
            type: object
            properties:
              grant_id: { type: string }
              granted_by: { type: string }
        interventions:
          type: object
          description: How often a person stepped in; see recipes.md "Person interventions".
          properties:
            total: { type: integer }
            approvals: { type: integer }
            confirmed: { type: integer }
            corrected: { type: integer }
            answered: { type: integer }
            corrections:
              type: array
              items:
                type: object
                properties:
                  step_id: { type: string }
                  field: { type: string }
                  proposed: {}
                  given: {}
                  delta: { type: number }
        steps:
          type: array
          items:
            type: object
            required: [step_id, state]
            properties:
              step_id: { type: string }
              state: { type: string, enum: [pending, running, waiting, done, failed, skipped] }
              job_id: { type: [string, "null"] }
              output: { type: object, additionalProperties: true }
              proposal:
                type: object
                description: A waiting person step's input as proposed (usually by the agent), for a person to confirm.
                required: [input, by, at]
                properties:
                  input: { type: object, additionalProperties: true }
                  by: { type: string, description: Token name of the proposer. }
                  at: { type: string, format: date-time }
                  note: { type: string }

    LogEntry:
      type: object
      required: [entry_id, at, kind, text]
      properties:
        entry_id: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [note, scan, export, measure, run, check, approval, rule, error] }
        text: { type: string }
        author: { type: string, description: Token name, or "bridge". }
        project_id: { type: [string, "null"] }
        refs:
          type: object
          additionalProperties: { type: string }
          description: Related ids (job_id, scan_id, run_id, step_id, grant_id, export_id).
